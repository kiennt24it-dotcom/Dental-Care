spring:
  datasource:
    url: jdbc:h2:mem:dentalcare-local;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
app:
  jwt:
    secret: ${JWT_SECRET:ZGVudGFsY2FyZS1sb2NhbC1kZXZlbG9wbWVudC1zZWNyZXQta2V5LWNoYW5nZS1tZS0zMg==}
  ai:
    url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  clinic-timezone: ${CLINIC_TIMEZONE:Asia/Ho_Chi_Minh}
  seed:
    enabled: true
